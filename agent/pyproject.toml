[project]
name = "kaizen-livekit-agent"
version = "1.0.0"
description = "KAIZEN Autonomous LiveKit Voice Agent with FDB-v3 compliance and Lifelong Learning"
authors = [{ name = "KAIZEN Team" }]
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[google,silero]~=1.3",
    "livekit~=1.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

